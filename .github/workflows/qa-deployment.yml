name: Deploy to QA Org (RSOCL_Approved_QA)

on:
  push:
    branches:
      - QA
    paths:
      - "force-app/**"
  workflow_dispatch:

jobs:
  deploy-qa:
    name: Deploy Delta to QA Org
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Dependencies & CLI
        env:
          SF_CONFIRM_PLUGINS: "true"
        run: |
          npm install --legacy-peer-deps
          wget -q https://developer.salesforce.com/media/salesforce-cli/sf/channels/stable/sf-linux-x64.tar.xz
          mkdir -p ~/sf
          tar xJf sf-linux-x64.tar.xz -C ~/sf --strip-components 1
          echo "$HOME/sf/bin" >> $GITHUB_PATH
          echo y | ~/sf/bin/sf plugins install sfdx-git-delta

      - name: Lint LWC Components (ESLint)
        run: npm run lint

      - name: Run LWC Unit Tests (Jest)
        run: npm run test:unit:coverage

      - name: Run Apex Static Analysis (PMD)
        uses: pmd/pmd-github-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          rulesets: "pmd/ruleset.xml"
          sourcePath: "force-app"
          analyzeModifiedFilesOnly: true

      - name: Generate Merge Delta Package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p changed-sources
          sf sgd source delta --to "HEAD" --from "HEAD^" --output changed-sources/ --generate-delta --source force-app/

      - name: Detect Test Classes for Merged Changes
        id: test-check
        run: |
          node scripts/check-apex-tests.js --delta-dir changed-sources/force-app --base-ref "HEAD^" --mode deploy

      - name: Authenticate to QA Org (RSOCL_Approved_QA)
        run: |
          echo "${{ secrets.SFDX_QA_AUTH_URL }}" > ./SFDX_QA_AUTH_URL.txt
          sf org login sfdx-url --sfdx-url-file ./SFDX_QA_AUTH_URL.txt --set-default --alias RSOCL_Approved_QA
          rm -f ./SFDX_QA_AUTH_URL.txt

      - name: Deploy Changes & Run Tests
        run: |
          DEPLOY_EXIT=0
          if [ -d "changed-sources/force-app" ]; then
            if [ "$TEST_LEVEL" = "RunSpecifiedTests" ]; then
              echo "Deploying with specified tests: $TESTS_TO_RUN"
              sf project deploy start --source-dir "changed-sources/force-app" --test-level RunSpecifiedTests --tests $TESTS_TO_RUN --json > deploy-result.json || DEPLOY_EXIT=$?
            else
              echo "No Apex classes in deployment. Deploying metadata without running tests."
              sf project deploy start --source-dir "changed-sources/force-app" --json > deploy-result.json || DEPLOY_EXIT=$?
            fi
            if [ -f "deploy-result.json" ]; then
              cat deploy-result.json
            fi
            if [ "$DEPLOY_EXIT" -ne 0 ]; then
              echo "❌ Salesforce deployment failed against QA org (exit code $DEPLOY_EXIT)."
              exit $DEPLOY_EXIT
            fi
          else
            echo "No Salesforce metadata changes in delta package."
          fi

      - name: Verify Code Coverage (Minimum 80%)
        if: always()
        run: |
          if [ -f "deploy-result.json" ]; then
            node scripts/check-code-coverage.js --file deploy-result.json --threshold 80
          else
            echo "No deploy result file to evaluate."
          fi

      - name: Deploy Destructive Changes (if any)
        run: |
          if [ -f "changed-sources/destructiveChanges/destructiveChanges.xml" ]; then
            echo "Deploying destructive changes..."
            sf project deploy start --metadata-dir "changed-sources/destructiveChanges" --ignore-warnings
          fi
