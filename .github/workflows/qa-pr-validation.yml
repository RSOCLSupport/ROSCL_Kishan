name: Validate PR on QA Branch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - QA
    paths:
      - 'force-app/**'

jobs:
  code-quality-qa:
    name: Code Quality & Security (ESLint & PMD)
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install PMD
        run: |
          wget -q https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.0.0/pmd-dist-7.0.0-bin.zip
          unzip -q pmd-dist-7.0.0-bin.zip
          echo "$GITHUB_WORKSPACE/pmd-bin-7.0.0/bin" >> $GITHUB_PATH

      - name: Install sfdx-git-delta
        run: echo y | npx sfdx-git-delta --version || npm install -g sfdx-git-delta

      - name: Generate PR Delta Package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p changed-sources
          sfdx sgd:source:delta --to "HEAD" --from "origin/${{ github.base_ref }}" --output changed-sources/ --generate-delta --source force-app/

      - name: Run ESLint on Changed JS Files
        run: node scripts/lint-pr-files.js --delta-dir changed-sources/force-app

      - name: Run PMD on Changed Apex Files
        run: node scripts/run-pmd.js --delta-dir changed-sources/force-app --pmd-bin "$GITHUB_WORKSPACE/pmd-bin-7.0.0/bin/pmd"

  validate-qa-build:
    name: Validate Build on QA Org (RSOCL_Approved_QA)
    runs-on: ubuntu-latest
    needs: code-quality-qa
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies & CLI
        run: |
          npm install --legacy-peer-deps
          npm install -g @salesforce/cli sfdx-git-delta

      - name: Generate PR Delta Package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p changed-sources
          sfdx sgd:source:delta --to "HEAD" --from "origin/${{ github.base_ref }}" --output changed-sources/ --generate-delta --source force-app/

      - name: Check Apex Tests & Mandatory Pairing
        id: test-check
        run: |
          node scripts/check-apex-tests.js --delta-dir changed-sources/force-app --base-ref "origin/${{ github.base_ref }}" --mode pr

      - name: Authenticate to QA Org (RSOCL_Approved_QA)
        run: |
          echo "${{ secrets.SFDX_QA_AUTH_URL }}" > ./SFDX_QA_AUTH_URL.txt
          sf org login sfdx-url --sfdx-url-file ./SFDX_QA_AUTH_URL.txt --set-default --alias RSOCL_Approved_QA
          rm -f ./SFDX_QA_AUTH_URL.txt

      - name: Check-only Deploy & Run Specified Tests
        run: |
          if [ -d "changed-sources/force-app" ]; then
            if [ "$TEST_LEVEL" = "RunSpecifiedTests" ]; then
              echo "Executing specified tests: $TESTS_TO_RUN"
              sf project deploy validate --source-dir "changed-sources/force-app" --test-level RunSpecifiedTests --tests $TESTS_TO_RUN --json > deploy-result.json || true
            else
              echo "No Apex classes modified. Running with NoTestRun."
              sf project deploy validate --source-dir "changed-sources/force-app" --test-level NoTestRun --json > deploy-result.json || true
            fi
            cat deploy-result.json
          else
            echo "No Salesforce metadata changes detected in PR delta."
          fi

      - name: Verify Code Coverage (Minimum 80%)
        run: |
          if [ -f "deploy-result.json" ]; then
            node scripts/check-code-coverage.js --file deploy-result.json --threshold 80
          else
            echo "No deploy result file to evaluate."
          fi
